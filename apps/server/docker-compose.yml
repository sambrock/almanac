name: almanac

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: almanac
      POSTGRES_PASSWORD: almanac
      POSTGRES_DB: almanac
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almanac -d almanac"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
